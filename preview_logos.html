<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #0B1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 40px;
      margin: 0;
    }
    .card {
      background: #111827;
      padding: 24px 36px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    h3 {
      color: #94A3B8;
      font-family: sans-serif;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Wordmark Logo (Variant 2)</h3>
    <img src="images/logo-wordmark.svg" height="60" />
  </div>

  <div class="card">
    <h3>Avatar Logo (Variant 1)</h3>
    <img src="images/logo-avatar.svg" height="60" />
  </div>
</body>
</html>
